name: Build and deploy Arety RCB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Arety RCB build
        run: |
          set -e
          mkdir -p assets
          curl -fL https://aretydocs-klnnt6z4.manus.space/ -o /tmp/original.html
          curl -fL https://aretydocs-klnnt6z4.manus.space/assets/index-DemdZT7B.js -o assets/index-DemdZT7B.js
          curl -fL https://aretydocs-klnnt6z4.manus.space/assets/index-D8y9y6EV.css -o assets/index-D8y9y6EV.css

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("/tmp/original.html").read_text(encoding="utf-8")

          head = src.split("<body>", 1)[0]
          head = re.sub(r'<link rel="manifest"[^>]*>', '', head, flags=re.I)

          clean = head + '''<body>
          <div id="root"></div>
          <script type="module" crossorigin src="/assets/index-DemdZT7B.js"></script>
          </body>
          </html>
          '''

          Path("index.html").write_text(clean, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
